services:
  - type: web
    name: bingx-combo-smc-engine
    runtime: python
    rootDir: signal_engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: DRY_RUN
        value: "false"
      - key: AUTO_SCHEDULER
        value: "true"
      - key: SYMBOLS
        value: BTC-USDT,ETH-USDT
      - key: SMC_MODE
        value: Veto Only

      - key: LIVE_LIMIT_15M
        value: "2"
      - key: BOOTSTRAP_LIMIT_15M
        value: "1000"
      - key: RECOVERY_LIMIT_15M
        value: "8"
      - key: CANDLE_KEEP_15M
        value: "12000"
      - key: SCAN_TOKEN
        generateValue: true
      - key: DISCORD_LOG_ENABLED
        value: "true"
      - key: DISCORD_LOG_LEVEL
        value: "ERROR"
      - key: DISCORD_PERIODIC_LOG_ENABLED
        value: "false"
      - key: DISCORD_STARTUP_TEST
        value: "false"
