services:
  - type: web
    name: bingx-combo-smc-engine
    runtime: python
    rootDir: signal_engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: AUTO_SCHEDULER
        value: "true"
      - key: SYMBOLS
        value: BTC-USDT,ETH-USDT
      - key: SMC_MODE
        value: Veto Only
      - key: BOOTSTRAP_LIMIT_15M
        value: "3400"
      - key: CANDLE_KEEP_15M
        value: "3400"
      - key: SCAN_TOKEN
        generateValue: true
      - key: DISCORD_STARTUP_TEST
        value: "false"
