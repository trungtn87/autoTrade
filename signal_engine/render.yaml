services:
  - type: web
    name: bingx-combo-smc-engine
    runtime: python
    rootDir: signal_engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: DRY_RUN
        value: "true"
      - key: AUTO_SCHEDULER
        value: "false"
      - key: SYMBOLS
        value: BTC-USDT,ETH-USDT
      - key: SMC_MODE
        value: Veto Only
