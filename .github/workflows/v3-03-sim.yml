name: V3-03 Offline M1 Execution Simulator
on:
  pull_request:
    branches: [main]
    paths:
      - 'autotrade_v3/**'
      - '.github/workflows/v3-03-sim.yml'
  push:
    branches: [main]
    paths:
      - 'autotrade_v3/**'
      - '.github/workflows/v3-03-sim.yml'

jobs:
  simulated-scenarios:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned offline V3 requirements
        run: python -m pip install -r autotrade_v3/requirements-replay.txt
      - name: Run entire simulator regression suite
        run: python -m unittest autotrade_v3.tests.test_simulate_execution -v
      - name: Compile V3 tools
        run: python -m compileall -q autotrade_v3
