name: V3-02 Exact Signal Replay
on:
  pull_request:
    branches: [main]
    paths:
      - 'autotrade_v3/**'
      - '.github/workflows/v3-02-replay.yml'
  push:
    branches: [main]
    paths:
      - 'autotrade_v3/**'
      - '.github/workflows/v3-02-replay.yml'
jobs:
  replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r autotrade_v3/requirements-replay.txt
      - run: python -m unittest autotrade_v3.tests.test_replay_20final -v
      - run: python -m compileall -q autotrade_v3
