name: Python Research Data Validation
on:
  push:
    branches: [research-python-backtest]
    paths: ['backtest/**', '.github/workflows/python-research.yml']
  workflow_dispatch:
    inputs:
      start:
        description: 'UTC inclusive start (aligned to 00:00)'
        default: '2026-04-01'
      end:
        description: 'UTC exclusive end'
        default: '2026-09-21'
permissions:
  contents: read
concurrency:
  group: research-data
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backtest
    env:
      START_DATE: ${{ inputs.start || '2026-04-01' }}
      END_DATE: ${{ inputs.end || '2026-09-21' }}
      TZ: UTC
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_data
      - uses: actions/cache/restore@v4
        with:
          path: backtest/data/pages
          key: bingx-pages-v2-${{ github.run_id }}
          restore-keys: bingx-pages-v2-
      - name: Download and validate only (no backtest)
        run: python -u bootstrap_data.py --start "$START_DATE" --end "$END_DATE"
      - name: Record exact environment
        if: always()
        run: pip freeze > data/environment.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: backtest/data/pages
          key: bingx-pages-v2-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bingx-validated-data-${{ github.run_id }}
          path: |
            backtest/data/*.pkl
            backtest/data/manifest.json
            backtest/data/environment.txt
          retention-days: 90
          if-no-files-found: error
