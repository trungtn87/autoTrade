name: Python Research Backtest + Public Data

on:
  push:
    branches: [research-python-backtest]
    paths: ['backtest/RUN_RESEARCH']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-public-data
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backtest
    env:
      TRADE_START: '2026-07-01'
      TZ: UTC
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      RUN7_ARTIFACT_ID: '10626316052'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - run: pip install -r requirements.txt

      - name: Data unit tests
        run: python -m unittest -v test_data

      - name: Restore research cache
        uses: actions/cache/restore@v4
        with:
          path: |
            backtest/data/pages
            backtest/data/store
          key: public-market-v4-${{ github.run_id }}
          restore-keys: |
            public-market-v4-
            public-market-v3-

      - name: Seed store from validated run 7 when cache is empty
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -f data/store/BTCUSDT_15m.pkl ] || [ ! -f data/store/ETHUSDT_15m.pkl ]; then
            mkdir -p data/seed data/store
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUN7_ARTIFACT_ID}/zip" > data/seed/run7.zip
            unzip -q -o data/seed/run7.zip -d data/seed
            python seed_store.py --seed-dir data/seed --store-dir data/store
          fi

      - name: Reverse yearly BingX 15m backfill
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/manifests

          run_year () {
            year="$1"
            start="$2"
            end="$3"
            echo "===== BACKFILL ${year}: ${start} -> ${end} ====="
            if python -u bootstrap_data.py --start "$start" --end "$end" --out-dir data --sleep 1.05; then
              cp data/manifest.json "data/manifests/${year}.json"
              echo "===== ${year} PASS ====="
            else
              cp data/manifest.json "data/manifests/${year}.json" || true
              echo "===== ${year} FAIL; continuing to older year; valid pages remain cached ====="
            fi
          }

          run_year 2026 2026-01-01 2026-09-21
          run_year 2025 2025-01-01 2026-01-01
          run_year 2024 2024-01-01 2025-01-01
          run_year 2023 2023-01-01 2024-01-01
          run_year 2022 2022-01-01 2023-01-01
          run_year 2021 2021-01-01 2022-01-01

      - name: Probe all public sources and build fallback dataset
        shell: bash
        run: |
          set -euo pipefail
          python -u multisource_backfill.py --out-dir data/multisource --store-dir data/store

      - name: Record exact environment
        if: always()
        run: |
          mkdir -p data
          pip freeze > data/environment.txt

      - name: Save research cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            backtest/data/pages
            backtest/data/store
          key: public-market-v4-${{ github.run_id }}

      - name: Upload data checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reverse-year-backfill-${{ github.run_id }}
          path: |
            backtest/data/manifest.json
            backtest/data/manifests/*.json
            backtest/data/environment.txt
            backtest/data/store/*.pkl
            backtest/data/multisource/*.json
            backtest/data/multisource/*.pkl
          retention-days: 90
          if-no-files-found: error
