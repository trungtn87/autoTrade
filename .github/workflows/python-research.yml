name: Python Research Backtest

on:
  push:
    branches: [research-python-backtest]
    paths:
      - 'backtest/**'
      - '.github/workflows/python-research.yml'
  workflow_dispatch:
    inputs:
      start:
        description: 'History start date (UTC)'
        required: false
        default: '2021-01-01'
      end:
        description: 'History end date (UTC, YYYY-MM-DD)'
        required: false
        default: ''
      commission:
        description: 'Commission percent per side'
        required: false
        default: '0.0'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backtest
    env:
      START_DATE: ${{ github.event.inputs.start || '2021-01-01' }}
      END_DATE: ${{ github.event.inputs.end || '' }}
      COMMISSION: ${{ github.event.inputs.commission || '0.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backtest/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Synthetic self-test
        run: python selftest.py

      - name: Resolve end date
        id: dates
        shell: bash
        run: |
          if [ -z "$END_DATE" ]; then
            END_DATE="$(date -u +%F)"
          fi
          echo "start=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "Downloading $START_DATE -> $END_DATE"

      - name: Download BingX BTC/ETH history
        run: |
          python bootstrap_data.py             --symbols BTC-USDT,ETH-USDT             --intervals 15m,1h,4h,6h             --start "${{ steps.dates.outputs.start }}"             --end "${{ steps.dates.outputs.end }}"             --out-dir data

      - name: Research BTC RAW vs OB
        run: |
          python research_pipeline.py             --symbol BTCUSDT             --data15 data/BTCUSDT_15m.pkl             --data1h data/BTCUSDT_1h.pkl             --data4h data/BTCUSDT_4h.pkl             --data6h data/BTCUSDT_6h.pkl             --commission "$COMMISSION"             --danger 0.0,0.5             --out-dir results/BTCUSDT

      - name: Research ETH RAW vs OB
        run: |
          python research_pipeline.py             --symbol ETHUSDT             --data15 data/ETHUSDT_15m.pkl             --data1h data/ETHUSDT_1h.pkl             --data4h data/ETHUSDT_4h.pkl             --data6h data/ETHUSDT_6h.pkl             --commission "$COMMISSION"             --danger 0.0,0.5             --out-dir results/ETHUSDT

      - name: Print data manifest
        if: always()
        run: cat data/manifest.json || true

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-results-${{ github.run_id }}
          path: backtest/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload BingX datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingx-market-data-${{ github.run_id }}
          path: |
            backtest/data/*.pkl
            backtest/data/manifest.json
          if-no-files-found: warn
          retention-days: 14
