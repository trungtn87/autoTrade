name: Final 11 Validation

on:
  push:
    branches: [research-python-backtest]
    paths: ['backtest/RUN_FINAL11']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backtest
    env:
      TZ: UTC
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      RUN17_ARTIFACT_ID: '10636714622'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: pip install -r requirements.txt

      - name: Download verified long dataset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/run17
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUN17_ARTIFACT_ID}/zip" > data/run17/run17.zip
          unzip -q -o data/run17/run17.zip -d data/run17
          test -f data/run17/data/multisource/BTCUSDT_hybrid_15m.pkl
          test -f data/run17/data/multisource/ETHUSDT_hybrid_15m.pkl

      - name: Run locked final 11 validation
        shell: bash
        run: |
          set -euo pipefail
          python -u final11_validation.py \
            --btc data/run17/data/multisource/BTCUSDT_hybrid_15m.pkl \
            --eth data/run17/data/multisource/ETHUSDT_hybrid_15m.pkl \
            --candidates production_candidates_11.json \
            --out-dir results/final11_validation

      - name: Upload final validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final11-validation-${{ github.run_id }}
          path: |
            backtest/results/final11_validation/*.csv
            backtest/results/final11_validation/*.json
          if-no-files-found: warn
          retention-days: 90
