name: 20FINAL Six-Window Real-Data Split Trailing Backtest

on:
  push:
    branches: [backtest-20final-6windows-20261026]
    paths:
      - 'autotrade_v2/tests/backtest_20final_6windows.py'
      - '.github/workflows/backtest-20final-6windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  six-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: autotrade_v2
    steps:
      - name: Checkout exact V2 code
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install strategy dependencies
        run: python -m pip install -r autotrade_v2/requirements.txt

      - name: Retrieve preserved historical data (2021-09/2026)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests, zipfile
          from pathlib import Path
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/10635463447/zip"
          headers = {"Authorization": "Bearer "+os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          r = requests.get(api, headers=headers, allow_redirects=False, timeout=60)
          r.raise_for_status()
          if r.status_code not in (301,302,303,307,308):
              raise RuntimeError("Expected GitHub artifact redirect, got "+str(r.status_code))
          dl = requests.get(r.headers["Location"], timeout=180)
          dl.raise_for_status()
          p = Path("history.zip"); p.write_bytes(dl.content)
          with zipfile.ZipFile(p) as archive:
              for path in ("data/multisource/BTCUSDT_hybrid_15m.pkl",
                           "data/multisource/ETHUSDT_hybrid_15m.pkl"):
                  archive.extract(path, ".")
          print("Historical dataset restored, bytes:", len(dl.content), flush=True)
          PY

      - name: Verify code compiles and trailing activation tests
        run: |
          python -m py_compile autotrade_v2/tests/backtest_20final_6windows.py
          python autotrade_v2/tests/trailing_activation_test.py
          python autotrade_v2/tests/tp_trailing_split_test.py

      - name: Run all six windows
        run: |
          python -u autotrade_v2/tests/backtest_20final_6windows.py \
            --btc data/multisource/BTCUSDT_hybrid_15m.pkl \
            --eth data/multisource/ETHUSDT_hybrid_15m.pkl \
            --out results/backtest_20final_6windows

      - name: Upload six-window summary and trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-20final-6windows
          path: results/backtest_20final_6windows/
          if-no-files-found: warn
          retention-days: 60
