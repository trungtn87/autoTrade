name: Dashboard exit attribution checks

on:
  push:
    branches: [feature/dashboard-bingx-exit-matching-20261026, main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-exit-attribution.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-exit-attribution.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: dashboard
      DB_SCHEMA: ''
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r dashboard/requirements.txt pytest httpx
      - name: Compile dashboard Python
        run: python -m compileall -q dashboard/autotrade_live
      - name: Validate dashboard JavaScript syntax
        run: node --check dashboard/autotrade_live/static/app.js
      - name: Offline tests (no BingX credentials or live requests)
        run: python -m pytest dashboard/tests -q
