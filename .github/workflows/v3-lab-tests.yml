name: AutoTrade V3 Research Lab CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  lab-quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r autotrade_v3/requirements-replay.txt pyarrow pytest ruff pandas

      - name: Prepare Artifacts Directory
        run: |
          mkdir -p evidence/ci_artifacts

      - name: Record Git State & Commit SHA
        run: |
          echo "=== GIT REV-PARSE HEAD ===" > evidence/ci_artifacts/git_head.txt
          git rev-parse HEAD >> evidence/ci_artifacts/git_head.txt
          echo "=== GIT STATUS PORCELAIN ===" > evidence/ci_artifacts/git_status.txt
          git status --porcelain >> evidence/ci_artifacts/git_status.txt
          cat evidence/ci_artifacts/git_head.txt
          cat evidence/ci_artifacts/git_status.txt

      - name: Ruff Lint Check
        run: |
          ruff check autotrade_v3 scripts

      - name: Python Compileall Check
        run: |
          python -m compileall autotrade_v3 scripts

      - name: AC5 Hardcoded Metrics Scan
        run: |
          python -m autotrade_v3.tools.scan_hardcoded_metrics --log-out evidence/ci_artifacts/hardcode_scan.log

      - name: Verify Golden Invariants & Hashes
        run: |
          set -euo pipefail
          (
            cd runs/golden/v3-08
            sha256sum --check SHA256SUMS.txt
          ) | tee evidence/ci_artifacts/golden_parity.log

      - name: Run Test Suite (pytest)
        run: |
          set -euo pipefail
          pytest autotrade_v3/tests \
            --junitxml=evidence/ci_artifacts/junit.xml \
            2>&1 | tee evidence/ci_artifacts/pytest_full.log

      - name: Upload CI Evidence Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-09-ci-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/ci_artifacts/
