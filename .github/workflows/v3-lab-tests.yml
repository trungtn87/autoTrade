name: AutoTrade V3 Research Lab CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  lab-quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r autotrade_v3/requirements-dashboard.txt pyarrow pytest ruff mypy

      - name: Prepare Artifacts Directory
        run: |
          mkdir -p evidence/ci_artifacts

      - name: Record Git State & Commit SHA
        run: |
          echo "=== GIT REV-PARSE HEAD ===" > evidence/ci_artifacts/git_head.txt
          git rev-parse HEAD >> evidence/ci_artifacts/git_head.txt
          echo "=== GIT STATUS PORCELAIN ===" > evidence/ci_artifacts/git_status.txt
          git status --porcelain >> evidence/ci_artifacts/git_status.txt
          cat evidence/ci_artifacts/git_head.txt
          cat evidence/ci_artifacts/git_status.txt

      - name: Ruff Lint Check
        run: |
          ruff check autotrade_v3 scripts

      - name: Mypy Baseline Check (No Increase)
        run: |
          python -m autotrade_v3.tools.check_mypy_baseline

      - name: Python Compileall Check
        run: |
          python -m compileall autotrade_v3 scripts

      - name: AC5 Hardcoded Metrics Scan
        run: |
          python -m autotrade_v3.tools.scan_hardcoded_metrics --log-out evidence/ci_artifacts/hardcode_scan.log

      - name: Verify Golden Invariants & Hashes
        run: |
          set -euo pipefail
          python - <<'PY' | tee evidence/ci_artifacts/golden_parity.log
          from hashlib import sha256
          from pathlib import Path

          golden_root = Path("runs/golden")
          baseline_path = Path("evidence/v3-16/golden_hashes_before.txt")
          expected = {}
          for line in baseline_path.read_text(encoding="utf-8-sig").splitlines():
              digest, rel = line.split(maxsplit=1)
              expected[rel.replace("\\", "/")] = digest.lower()

          actual_paths = {
              path.as_posix()
              for path in golden_root.rglob("*")
              if path.is_file()
          }
          if actual_paths != set(expected):
              missing = sorted(set(expected) - actual_paths)
              extra = sorted(actual_paths - set(expected))
              raise SystemExit(f"Golden file set changed; missing={missing}, extra={extra}")

          for rel, wanted in sorted(expected.items()):
              got = sha256(Path(rel).read_bytes()).hexdigest()
              if got != wanted:
                  raise SystemExit(f"Golden hash mismatch: {rel}")
          print(f"Golden SHA-256 OK: {len(expected)} files")
          PY

      - name: Verify Forbidden Scope Is Unchanged
        run: |
          set -euo pipefail
          test -z "$(git diff 7cbe662..HEAD -- \
            autotrade_v3/live \
            unified_app.py \
            autotrade_v2 \
            dashboard \
            runs/golden \
            autotrade_v3/strategy_core)"

      - name: Run Test Suite (pytest)
        run: |
          set -euo pipefail
          pytest autotrade_v3/tests \
            --junitxml=evidence/ci_artifacts/junit.xml \
            2>&1 | tee evidence/ci_artifacts/pytest_full.log

      - name: Upload CI Evidence Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-09-ci-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/ci_artifacts/
