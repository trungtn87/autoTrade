name: Build Cao Bang Weather APK

on:
  push:
    branches: [cao-bang-weather]
    paths:
      - 'cao-bang-weather/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cao-bang-weather
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CaoBangWeather-v1.0.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaoBangWeather-APK
          path: cao-bang-weather/CaoBangWeather-v1.0.0.apk
          if-no-files-found: error
