name: Unified single-service deploy checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, simplify/autotrade-no-deploy-switch-20261030]
permissions:
  contents: read
jobs:
  unified:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install combined Python requirements for offline tests
        run: python -m pip install --disable-pip-version-check -r requirements.txt httpx socksio
      - name: Reproduce Railpack pip stage with ONLY root requirements copied
        shell: bash
        run: |
          set -euo pipefail
          isolated_dir="$(mktemp -d)"
          cp requirements.txt "$isolated_dir/requirements.txt"
          # Railpack builds the pip layer before copying app subdirectories.
          # Check package resolution in that exact limited filesystem layout.
          python -m pip install --disable-pip-version-check --dry-run -r "$isolated_dir/requirements.txt"
      - name: Compile combined entrypoint
        run: python -m compileall -q unified_app.py
      - name: Test both application lifespans and route isolation
        env:
          DISCORD_ENABLED: 'false'
        run: python scripts/check-unified.py
      - name: Build root Dockerfile
        run: docker build -t autotrade-unified .
      - name: Test root Docker startup without credentials or networking
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name autotrade-unified-test --network none             -e DISCORD_ENABLED=false -e DATABASE_URL=             autotrade-unified
          trap 'docker logs autotrade-unified-test; docker rm -f autotrade-unified-test' EXIT
          for attempt in $(seq 1 30); do
            if docker exec autotrade-unified-test python -c '
          import json, urllib.request
          root=json.load(urllib.request.urlopen("http://127.0.0.1:8000/health"))
          engine=json.load(urllib.request.urlopen("http://127.0.0.1:8000/engine/status"))
          assert root["service"] == "autotrade-dashboard" and root["trade_api"] is False
          assert engine["runtime"]["execution_enabled"] is False
          assert urllib.request.urlopen("http://127.0.0.1:8000/mobile").status == 200
          print("Unified root startup PASS")
          '; then
              exit 0
            fi
            sleep 1
          done
          exit 1
