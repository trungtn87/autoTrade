# Free Render web service ONLY. Scheduled BingX collection uses GitHub Actions on main.
services:
  - type: web
    name: autotrade-live-dashboard
    runtime: python
    plan: free
    rootDir: dashboard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn autotrade_live.mobile:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DB_SCHEMA
        value: autotrade_analytics
      - key: DATABASE_URL
        sync: false
      # Anyone with the Render URL can view trade PnL; never exposes exchange keys.
      - key: DASHBOARD_PUBLIC_READONLY
        value: 'true'
      # Set DASHBOARD_PUBLIC_READONLY=false and configure password/session to restore login.
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
